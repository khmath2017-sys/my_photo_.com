name: Build RuStore Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android files
      run: flutter create . --org com.khmath --project-name myphoto --platforms=android

    - name: Decode Keystore and Configure Gradle Signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | grep -v "BEGIN\|END" | tr -d '\n\r ' | base64 -d > android/app/upload-keystore.jks
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
        sed -i 's/android:label="myphoto"/android:label="Фоторедактор ИИ и PDF"/g' android/app/src/main/AndroidManifest.xml || true
        echo "-keep class ai.onnxruntime.** { *; }" >> android/app/proguard-rules.pro
        
        cat << 'EOF' >> android/app/build.gradle.kts

        extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
            lint {
                checkReleaseBuilds = false
                abortOnError = false
            }
            signingConfigs {
                getByName("debug") {
                    keyAlias = System.getenv("KEY_ALIAS")
                    keyPassword = System.getenv("KEY_PASSWORD")
                    storeFile = file("upload-keystore.jks")
                    storePassword = System.getenv("STORE_PASSWORD")
                }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get
      
    - name: Build Signed AAB (For RuStore)
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: flutter build appbundle --release

    - name: Build Signed APK (For Testing)
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: flutter build apk --release
      
    - name: Upload RuStore AAB
      uses: actions/upload-artifact@v4
      with:
        name: rustore-release-aab
        path: build/app/outputs/bundle/release/app-release.aab

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
