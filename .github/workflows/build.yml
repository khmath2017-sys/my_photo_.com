name: Build RuStore Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android files
      run: flutter create . --org com.khmath --project-name myphoto --platforms=android

    - name: Decode Keystore and Configure Signing
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > android/app/upload-keystore.jks
        cat <<EOF > android/key.properties
        storePassword=${{ secrets.STORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=upload-keystore.jks
        EOF

    - name: Configure Gradle SDK, App Name and Release Signing
      run: |
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
        sed -i 's/android:label="myphoto"/android:label="Фоторедактор ИИ и PDF"/g' android/app/src/main/AndroidManifest.xml || true
        echo "-keep class ai.onnxruntime.** { *; }" >> android/app/proguard-rules.pro
        cat <<EOF >> android/app/build.gradle.kts
        import java.util.Properties
        import java.io.FileInputStream
        val keystoreProperties = Properties()
        val keystorePropertiesFile = rootProject.file("key.properties")
        if (keystorePropertiesFile.exists()) {
            keystoreProperties.load(FileInputStream(keystorePropertiesFile))
        }
        android {
            lint {
                checkReleaseBuilds = false
                abortOnError = false
            }
            signingConfigs {
                create("release") {
                    keyAlias = keystoreProperties.getProperty("keyAlias")
                    keyPassword = keystoreProperties.getProperty("keyPassword")
                    storeFile = file(keystoreProperties.getProperty("storeFile"))
                    storePassword = keystoreProperties.getProperty("storePassword")
                }
            }
            buildTypes {
                getByName("release") {
                    signingConfig = signingConfigs.getByName("release")
                }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get
      
    - name: Build Signed AAB (For RuStore)
      run: flutter build appbundle --release

    - name: Build Signed APK (For Testing)
      run: flutter build apk --release
      
    - name: Upload RuStore AAB
      uses: actions/upload-artifact@v4
      with:
        name: rustore-release-aab
        path: build/app/outputs/bundle/release/app-release.aab

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk