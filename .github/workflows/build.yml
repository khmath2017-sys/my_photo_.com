name: Build RuStore Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android files
      run: flutter create . --org com.khmath --project-name myphoto --platforms=android

    - name: Generate Keystore and Configure Signing
      run: |
        keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass MyStrongPass123 -keypass MyStrongPass123 -dname "CN=Khaled, OU=Dev, O=KhMath, L=Moscow, S=Moscow, C=RU"
        
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
        sed -i 's/android:label="myphoto"/android:label="Фоторедактор ИИ и PDF"/g' android/app/src/main/AndroidManifest.xml || true
        echo "-keep class ai.onnxruntime.** { *; }" >> android/app/proguard-rules.pro
        
        cat << 'EOF' >> android/app/build.gradle.kts

        extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
            lint {
                checkReleaseBuilds = false
                abortOnError = false
            }
            signingConfigs {
                getByName("debug") {
                    keyAlias = "upload"
                    keyPassword = "MyStrongPass123"
                    storeFile = file("upload-keystore.jks")
                    storePassword = "MyStrongPass123"
                }
            }
        }
        EOF

    - name: Install dependencies
      run: |
        flutter pub get
        dart run flutter_launcher_icons
    - name: Build Signed AAB (For RuStore)
      run: flutter build appbundle --release

    - name: Build Signed APK (For Testing)
      run: flutter build apk --release
      
    - name: Upload RuStore Final Package
      uses: actions/upload-artifact@v4
      with:
        name: rustore-final-package
        path: |
          build/app/outputs/bundle/release/app-release.aab
          build/app/outputs/flutter-apk/app-release.apk
          android/app/upload-keystore.jks
