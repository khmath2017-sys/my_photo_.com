name: Generate Keystore Once

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Keystore and Base64
      run: |
        keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass MyStrongPass123 -keypass MyStrongPass123 -dname "CN=Khaled, OU=Dev, O=KhMath, L=Moscow, S=Moscow, C=RU"
        base64 -w 0 upload-keystore.jks > keystore_base64.txt

    - name: Upload Keystore Files
      uses: actions/upload-artifact@v4
      with:
        name: my-secret-keystore
        path: |
          upload-keystore.jks
          keystore_base64.txt
