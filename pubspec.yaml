name: my_photo_app
description: "A photo utility app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  pdf: ^3.11.1
  gal: ^2.3.0
  share_plus: ^10.0.2
  image: ^4.2.0
  path_provider: ^2.1.4
  image_background_remover: ^2.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png.png"
adaptive_icon_background: "#0D47A1"
adaptive_icon_foreground: "assets/icon.png.png"

flutter:
  uses-material-design: true
